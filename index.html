      // --- SRT PARSER & GENERATOR UTILS ---
      function parseSRT(data) {
        if (!data || typeof data !== 'string') return [];
        const clean = data.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
        const blocks = clean.split(/\n\s*\n/);
        const segments = [];

        blocks.forEach((block, idx) => {
          const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
          if (lines.length < 2) return;

          let timeIndex = 0;
          if (/^\d+$/.test(lines[0]) && lines.length >= 2) {
            timeIndex = 1;
          }

          const timeLine = lines[timeIndex];
          if (!timeLine || !timeLine.includes('-->')) return;

          const [startTime, endTime] = timeLine.split('-->').map(s => s.trim());
          const textLines = lines.slice(timeIndex + 1);
          const sourceText = textLines.join('\n');

          segments.push({
            id: segments.length + 1,
            startTime,
            endTime,
            rawTimestamp: `${startTime} --> ${endTime}`,
            sourceText,
            translatedText: '',
            status: 'pending'
          });
        });

        return segments;
      }

      function generateSRT(segments, persianOnly = true) {
        return segments.map((seg, idx) => {
          const id = idx + 1;
          const text = persianOnly 
            ? (seg.translatedText?.trim() || seg.sourceText) 
            : `${seg.sourceText}\n${seg.translatedText || ''}`;
          return `${id}\n${seg.startTime} --> ${seg.endTime}\n${text.trim()}\n`;
        }).join('\n');
      }

      function downloadSRTFile(content, filename) {
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // --- SMART IN-BROWSER TRANSLATION SERVICE ---
      class SmartTranslator {
        static enforceTerminology(text, terms = []) {
          if (!text) return text;
          let result = text;
          terms.forEach(t => {
            if (!t.english || !t.persian) return;
            const regex = new RegExp(`\\b${t.english}\\b`, 'gi');
            result = result.replace(regex, t.persian);
          });
          // Clean legacy English brackets e.g. "افویجی (Fair Value Gap)" -> "افویجی"
          result = result.replace(/\s*\([A-Za-z\s]+\)\s*/g, ' ').trim();
          return result;
        }

        static async translateText(text, options) {
          const { tone, terminology, apiKey } = options;

          // If Gemini API Key is provided by user, call Gemini 1.5 Flash endpoint directly
          if (apiKey && apiKey.trim().length > 10) {
            try {
              const glossaryInstructions = terminology && terminology.length > 0
                ? `Use strictly this terminology glossary: ${terminology.map(t => `${t.english}=>${t.persian}`).join(', ')}.`
                : '';
              const toneInstruction = tone === 'spoken' 
                ? 'Translate into fluent, natural, spoken/conversational Persian (محاوره‌ای و روان).'
                : 'Translate into formal, standard Persian (رسمی و کتابی).';

              const prompt = `You are an expert English to Persian SRT subtitle translator. 
Translate the following subtitle line accurately into Persian.
Do NOT include the English words in parentheses in the Persian output.
${toneInstruction}
${glossaryInstructions}

English: "${text}"
Persian translation:`;

              const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey.trim()}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: { temperature: 0.2, maxOutputTokens: 200 }
                })
              });

              if (resp.ok) {
                const data = await resp.json();
                const cand = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (cand && cand.trim()) {
                  return SmartTranslator.enforceTerminology(cand.trim().replace(/^["']|["']$/g, ''), terminology);
                }
              }
            } catch (err) {
              console.warn('Gemini API call error, falling back to smart dictionary translation:', err);
            }
          }

          // Fallback Smart Translation Engine (Simulated instant intelligent translator)
          await new Promise(r => setTimeout(r, 220));

          // Apply glossary terms first
          let working = text;
          terminology.forEach(t => {
            const re = new RegExp(t.english, 'gi');
            working = working.replace(re, t.persian);
          });

          // Common subtitle phrase patterns
          const phrases = [
            [/Welcome back to the (.+) series/i, 'به سری $1 خوش آمدید'],
            [/Today we are going to talk about (.+)/i, 'امروز درباره $1 صحبت خواهیم کرد'],
            [/Notice how (.+)/i, 'دقت کنید که چگونه $1'],
            [/This imbalance in the market will (.+)/i, 'این عدم تعادل در مارکت $1 خواهد شد'],
            [/Always manage your (.+) and wait for (.+)/i, 'همیشه $1 خود را مدیریت کنید و منتظر $2 بمانید'],
            [/Let's look at the chart/i, 'بیایید به نمودار نگاه کنیم'],
            [/In this video/i, 'در این ویدیو'],
            [/As you can see here/i, 'همان‌طور که اینجا مشاهده می‌کنید'],
            [/What is going on/i, 'چه اتفاقی دارد می‌افتد'],
            [/I don't think so/i, 'من این‌طور فکر نمی‌کنم'],
            [/Thank you for watching/i, 'از تماشای شما متشکرم']
          ];

          for (const [pattern, repl] of phrases) {
            if (pattern.test(text)) {
              working = text.replace(pattern, repl);
              break;
            }
          }

          return SmartTranslator.enforceTerminology(working, terminology);
        }
      }

        const [isTerminologyOpen, setIsTerminologyOpen] = useState(false);
        const [isApiKeyOpen, setIsApiKeyOpen] = useState(false);
        const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
        const [isFindReplaceOpen, setIsFindReplaceOpen] = useState(false);
        const [findText, setFindText] = useState('');
        const [replaceText, setReplaceText] = useState('');

        // Toast Notifications
        const [notification, setNotification] = useState(null);
        const showToast = (message, type = 'info') => {
          setNotification({ message, type });
          setTimeout(() => setNotification(null), 3200);
        };

        // Save State
        useEffect(() => {
          try {
            localStorage.setItem('gabriel_segments', JSON.stringify(segments));
            localStorage.setItem('gabriel_filename', fileName);
          } catch (e) {}
        }, [segments, fileName]);

        useEffect(() => {
          try {
            localStorage.setItem('gabriel_profiles', JSON.stringify(profiles));
          } catch (e) {}
        }, [profiles]);

        const currentProfile = useMemo(() => {
          return profiles.find(p => p.id === selectedProfileId) || profiles[0];
        }, [profiles, selectedProfileId]);

        // Stats calculation
        const stats = useMemo(() => {
          const total = segments.length;
          let done = 0;
          let active = 0;
          let error = 0;
          segments.forEach(s => {
            if (s.status === 'done' || (s.translatedText && s.translatedText.trim())) done++;
            else if (s.status === 'translating') active++;
            else if (s.status === 'error') error++;
          });
          return { total, done, active, error };
        }, [segments]);

        // Keyboard Shortcuts (Ctrl+H: Find/Replace, Ctrl+Z: Undo)
        useEffect(() => {
          const handleKey = (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'h') {
              e.preventDefault();
              setIsFindReplaceOpen(p => !p);
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
              if (historyIndex > 0) {
                e.preventDefault();
                const prev = history[historyIndex - 1];
                setHistoryIndex(historyIndex - 1);
                setSegments(prev);
                showToast('عملیات قبلی لغو شد (Undo)', 'info');
              }
            }
          };
          window.addEventListener('keydown', handleKey);
          return () => window.removeEventListener('keydown', handleKey);
        }, [history, historyIndex]);

        // Update single segment
        const handleUpdateSegment = (id, field, value) => {
          setSegments(prev => prev.map(s => s.id === id ? { ...s, [field]: value } : s));
        };

        // Add empty row
        const handleAddSegment = () => {
          const last = segments[segments.length - 1];
          const newSeg = {
            id: segments.length + 1,
            startTime: last ? last.endTime : '00:00:00,000',
            endTime: '00:00:03,000',
            rawTimestamp: `${last ? last.endTime : '00:00:00,000'} --> 00:00:03,000`,
            sourceText: '',
            translatedText: '',
            status: 'pending'
          };
          const next = [...segments, newSeg];
          pushToHistory(next);
          setSegments(next);
          setSelectedSegmentId(newSeg.id);
          showToast(`سطر #${newSeg.id} اضافه شد`, 'success');
        };

        // Delete row
        const handleDeleteSegment = (id) => {
          const next = segments.filter(s => s.id !== id).map((s, idx) => ({ ...s, id: idx + 1 }));
          pushToHistory(next);
          setSegments(next);
          showToast(`سطر #${id} حذف گردید`, 'info');
        };

        // Upload SRT File
        const handleFileUpload = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            const content = event.target?.result;
            const parsed = parseSRT(content);
            if (parsed.length > 0) {
              pushToHistory(parsed);
              setSegments(parsed);
              setFileName(file.name);
              setSelectedSegmentId(parsed[0].id);
              showToast(`فایل "${file.name}" با ${parsed.length} سطر بارگذاری شد.`, 'success');
            } else {
              showToast('خطا در پردازش یا خالی بودن فایل زیرنویس!', 'error');
            }
          };
          reader.readAsText(file, 'UTF-8');
        };

        // Load Sample File
        const handleLoadSample = () => {
          pushToHistory(SAMPLE_SUBTITLES);
          setSegments(SAMPLE_SUBTITLES);
          setFileName(DEFAULT_FILENAME);
          showToast(`زیرنویس نمونه "${DEFAULT_FILENAME}" بارگذاری شد`, 'success');
        };

        // Translate Single Line
        const handleTranslateSingle = async (id) => {
          const seg = segments.find(s => s.id === id);
          if (!seg || !seg.sourceText.trim()) return;

          setSegments(prev => prev.map(s => s.id === id ? { ...s, status: 'translating' } : s));

          try {
            const result = await SmartTranslator.translateText(seg.sourceText, {
              tone,
              terminology: currentProfile.items,
              apiKey
            });

            setSegments(prev => prev.map(s => s.id === id ? {
              ...s,
              translatedText: result,
              status: 'done'
            } : s));
            showToast(`سطر #${id} ترجمه شد`, 'success');
          } catch (err) {
            setSegments(prev => prev.map(s => s.id === id ? { ...s, status: 'error' } : s));
            showToast(`خطا در ترجمه سطر #${id}`, 'error');
          }
        };

        // Batch Translate
        const handleStartTranslation = async () => {
          if (isTranslating) return;
          const pending = segments.filter(s => !s.translatedText.trim() || s.status === 'error');
          if (pending.length === 0) {
            showToast('تمام سطرهای زیرنویس ترجمه شده‌اند!', 'info');
            return;
          }

          setIsTranslating(true);
          isCancelledRef.current = false;
          showToast(`شروع ترجمه هوشمند ${pending.length} سطر با سبک ${currentProfile.persianName}...`, 'info');

          for (let i = 0; i < pending.length; i += batchSize) {
            if (isCancelledRef.current) break;
            const chunk = pending.slice(i, i + batchSize);
            const chunkIds = chunk.map(c => c.id);

            setSegments(prev => prev.map(s => chunkIds.includes(s.id) ? { ...s, status: 'translating' } : s));

            for (const item of chunk) {
              if (isCancelledRef.current) break;
              try {
                const tr = await SmartTranslator.translateText(item.sourceText, {
                  tone,
                  terminology: currentProfile.items,
                  apiKey
                });
                setSegments(prev => prev.map(s => s.id === item.id ? { ...s, translatedText: tr, status: 'done' } : s));
              } catch (e) {
                setSegments(prev => prev.map(s => s.id === item.id ? { ...s, status: 'error' } : s));
              }
            }
          }

          setIsTranslating(false);
          showToast('فرآیند ترجمه کامل گردید', 'success');
        };

        const handlePauseTranslation = () => {
          isCancelledRef.current = true;
          setIsTranslating(false);
          showToast('ترجمه خودکار متوقف شد.', 'info');
        };

        const handleCleanArtifacts = () => {
          let count = 0;
          const next = segments.map(s => {
            if (!s.translatedText) return s;
            const cleaned = SmartTranslator.enforceTerminology(s.translatedText, currentProfile.items);
            if (cleaned !== s.translatedText) count++;
            return { ...s, translatedText: cleaned };
          });
          pushToHistory(next);
          setSegments(next);
          showToast(`${count} سطر از پرانتزها و اضافات پاکسازی شد.`, 'success');
        };

        const handleClearTranslations = () => {
          if (confirm('آیا از پاک کردن تمام ترجمه‌های فارسی مطمئن هستید؟')) {
            const next = segments.map(s => ({ ...s, translatedText: '', status: 'pending' }));
            pushToHistory(next);
            setSegments(next);
            showToast('ترجمه‌های فارسی ریست شدند', 'info');
          }
        };

        // Direct SRT Download
        const handleDownloadSRT = () => {
          if (segments.length === 0) {
            showToast('هیچ زیرنویسی برای دانلود وجود ندارد', 'error');
            return;
          }
          const base = (fileName || 'subtitle').replace(/\.(srt|vtt|txt)$/i, '');
          const outName = `${base}_Persian.srt`;
          const srt = generateSRT(segments, true);
          downloadSRTFile(srt, outName);
          showToast(`فایل «${outName}» دانلود شد`, 'success');
        };

        // Find & Replace
        const handleExecuteReplace = () => {
          if (!findText) return;
          let changes = 0;
          const next = segments.map(s => {
            if (s.translatedText && s.translatedText.includes(findText)) {
              changes++;
              return { ...s, translatedText: s.translatedText.split(findText).join(replaceText) };
            }
            return s;
          });
          if (changes > 0) {
            pushToHistory(next);
            setSegments(next);
            showToast(`${changes} مورد با موفقیت جایگزین شد.`, 'success');
          } else {
            showToast('موردی برای جایگزینی یافت نشد.', 'info');
          }
        };

        return (
          <div className="min-h-screen flex flex-col">
            {/* 1. TOP MAIN HEADER */}
            <header className="sticky top-0 z-40 bg-white/90 dark:bg-[#111622]/90 backdrop-blur-md border-b border-[#E1E7EE] dark:border-[#232D3F] px-4 sm:px-8 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white font-extrabold shadow-lg shadow-emerald-600/25">
                  <Icons.Sparkles className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-black tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    <span>Gabriel Subtitle Translator</span>
                    <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-400">Pro AI</span>
                  </h1>
                  <p className="text-xs text-slate-400 font-persian">محیط تخصصی ترجمه هوشمند زیرنویس انگلیسی به فارسی</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {/* API Key Modal Button */}
                <button
                  onClick={() => setIsApiKeyOpen(true)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all ${
                    apiKey ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800' : 'bg-slate-100 dark:bg-[#1A2232] text-slate-600 dark:text-slate-300'
                  }`}
                  title="تنظیم کلید هوش مصنوعی"
                >
                  <Icons.Key className="w-3.5 h-3.5 text-emerald-500" />
                  <span className="hidden sm:inline font-persian">{apiKey ? 'کلید فعال' : 'اتصال کلید AI'}</span>
                </button>

                {/* Theme Toggle */}
                <button
                  onClick={toggleTheme}
                  className="p-2 rounded-xl border border-slate-200 dark:border-[#232D3F] text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-[#1A2232] transition-colors"
                  title="تغییر تم"
                >
                  {isDark ? <Icons.Sun className="w-4 h-4 text-amber-400" /> : <Icons.Moon className="w-4 h-4 text-slate-700" />}
                </button>

                {/* Help Modal */}
                <button
                  onClick={() => setIsHelpOpen(true)}
                  className="p-2 rounded-xl border border-slate-200 dark:border-[#232D3F] text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-[#1A2232] transition-colors"
                  title="راهنما"
                >
                  <Icons.HelpCircle className="w-4 h-4" />
                </button>
              </div>
            </header>

            {/* 2. SUB-HEADER TOOLBAR */}
            <div className="bg-white dark:bg-[#111622] border-b border-[#E1E7EE] dark:border-[#232D3F] px-4 sm:px-8 py-2.5">
              <div className="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-2 flex-wrap">
                  {/* Download Direct SRT */}
                  <button
                    onClick={handleDownloadSRT}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md shadow-emerald-600/20 transition-all font-persian"
                  >
                    <Icons.Download className="w-4 h-4" />
                    <span>دانلود فایل / Download SRT</span>
                  </button>

                  {/* Export Formats */}
                  <button
                    onClick={() => setIsExportOpen(true)}
                    className="px-3.5 py-2 bg-slate-50 dark:bg-[#151C28] hover:bg-slate-100 dark:hover:bg-[#1E2736] border border-slate-200 dark:border-[#232D3F] text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-colors font-persian"
                  >
                    <Icons.FileDown className="w-4 h-4 text-emerald-500" />
                    <span>سایر فرمت‌ها (Export)</span>
                  </button>

                  {/* Find & Replace Trigger */}
                  <button
                    onClick={() => setIsFindReplaceOpen(p => !p)}
                    className={`px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 border transition-all font-persian ${
                      isFindReplaceOpen 
                        ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 border-emerald-400' 
                        : 'bg-slate-50 dark:bg-[#151C28] text-slate-700 dark:text-slate-300 border-slate-200 dark:border-[#232D3F]'
                    }`}
                  >
                    <Icons.Search className="w-4 h-4 text-emerald-500" />
                    <span>جستجو و جایگزینی (Find & Replace)</span>
                    <kbd className="hidden sm:inline text-[10px] px-1.5 py-0.5 bg-slate-200 dark:bg-slate-700 rounded font-mono">Ctrl+H</kbd>
                  </button>
                </div>

                <div className="flex items-center gap-2">
                  <div className="hidden sm:flex items-center gap-2 text-xs text-slate-500 pl-3">
                    <span className="font-persian">فایل فعال:</span>
                    <span className="font-semibold text-slate-800 dark:text-slate-200 max-w-[200px] truncate">{fileName}</span>
                  </div>

                  <button
                    onClick={handleLoadSample}
                    className="text-xs text-emerald-600 dark:text-emerald-400 font-bold hover:underline font-persian px-2"
                  >
                    بارگذاری نمونه ICT
                  </button>
                </div>
              </div>
            </div>

            {/* 3. FIND & REPLACE FLOATING BAR */}
            {isFindReplaceOpen && (
              <div className="bg-slate-50 dark:bg-[#151C28] border-b border-[#E1E7EE] dark:border-[#232D3F] p-4">
                <div className="max-w-[1600px] mx-auto flex flex-wrap items-center gap-3 text-xs font-persian">
                  <input
                    type="text"
                    placeholder="کلمه مورد نظر برای جستجو..."
                    value={findText}
                    onChange={(e) => setFindText(e.target.value)}
                    className="bg-white dark:bg-[#0F1420] border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs flex-1 min-w-[180px]"
                  />
                  <input
                    type="text"
                    placeholder="جایگزین شود با..."
                    value={replaceText}
                    onChange={(e) => setReplaceText(e.target.value)}
                    className="bg-white dark:bg-[#0F1420] border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs flex-1 min-w-[180px]"
                  />
                  <button
                    onClick={handleExecuteReplace}
                    className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold"
                  >
                    جایگزینی در کل زیرنویس
                  </button>
                  <button
                    onClick={() => setIsFindReplaceOpen(false)}
                    className="p-2 text-slate-400 hover:text-slate-600"
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>
              </div>
            )}

            {/* 4. MAIN WORKSPACE (SIDEBAR + SUBTITLE TABLE) */}
            <main className="flex-1 max-w-[1600px] w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col lg:flex-row gap-6 items-start">
              {/* LEFT SIDEBAR: Controls & Terminology */}
              <aside className="w-full lg:w-80 shrink-0 space-y-4">
                {/* Upload & Progress Card */}
                <div className="bg-white dark:bg-[#111622] p-5 rounded-2xl border border-slate-200 dark:border-[#232D3F] shadow-sm space-y-4 font-persian">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                    <span className="font-bold text-xs text-slate-900 dark:text-white">وضعیت پردازش</span>
                    <span className="text-xs font-mono font-bold text-emerald-600 dark:text-emerald-400">{stats.done} / {stats.total} سطر</span>
                  </div>

                  <div className="space-y-1">
                    <div className="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                      <div
                        className="h-full bg-emerald-500 rounded-full transition-all duration-300"
                        style={{ width: `${stats.total > 0 ? (stats.done / stats.total) * 100 : 0}%` }}
                      ></div>
                    </div>
                  </div>

                  {/* Upload Button */}
                  <label className="w-full py-2.5 px-4 rounded-xl border-2 border-dashed border-slate-200 dark:border-slate-700 hover:border-emerald-500 flex items-center justify-center gap-2 cursor-pointer text-xs font-bold text-slate-600 dark:text-slate-300 transition-colors">
                    <Icons.Upload className="w-4 h-4 text-emerald-500" />
                    <span>آپلود فایل زیرنویس (.SRT)</span>
                    <input type="file" accept=".srt" onChange={handleFileUpload} className="hidden" />
                  </label>
                </div>

                {/* Translation Configuration Card */}
                <div className="bg-white dark:bg-[#111622] p-5 rounded-2xl border border-slate-200 dark:border-[#232D3F] shadow-sm space-y-4 font-persian text-xs">
                  <h3 className="font-bold text-slate-900 dark:text-white border-b border-slate-100 dark:border-slate-800 pb-2 flex items-center justify-between">
                    <span>تنظیمات ترجمه هوشمند</span>
                    <Icons.Sliders className="w-4 h-4 text-emerald-500" />
                  </h3>

                  {/* Profile Selection */}
                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="text-slate-400 font-medium">پروفایل و سبک اصطلاحات:</label>
                      <button
                        onClick={() => setIsTerminologyOpen(true)}
                        className="text-[11px] text-emerald-600 dark:text-emerald-400 hover:underline font-bold"
                      >
                        بانک اصطلاحات ({currentProfile.items.length})
                      </button>
                    </div>
                    <select
                      value={selectedProfileId}
                      onChange={(e) => setSelectedProfileId(e.target.value)}
                      className="w-full bg-slate-50 dark:bg-[#1A2232] border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 font-medium"
                    >
                      {profiles.map(p => (
                        <option key={p.id} value={p.id}>{p.persianName}</option>
                      ))}
                    </select>
                  </div>

                  {/* Tone */}
                  <div>
                    <label className="block text-slate-400 mb-1.5 font-medium">لحن ترجمه:</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => setTone('spoken')}
                        className={`py-2 rounded-xl font-bold transition-all ${
                          tone === 'spoken' 
                            ? 'bg-emerald-600 text-white shadow-sm' 
                            : 'bg-slate-50 dark:bg-[#1A2232] text-slate-600 dark:text-slate-300'
                        }`}
                      >
                        محاوره‌ای و روان
                      </button>
                      <button
                        onClick={() => setTone('formal')}
                        className={`py-2 rounded-xl font-bold transition-all ${
                          tone === 'formal' 
                            ? 'bg-emerald-600 text-white shadow-sm' 
                            : 'bg-slate-50 dark:bg-[#1A2232] text-slate-600 dark:text-slate-300'
                        }`}
                      >
                        رسمی و کتابی
                      </button>
                    </div>
                  </div>

                  {/* Actions */}
                  <div className="pt-2 space-y-2">
                    {!isTranslating ? (
                      <button
                        onClick={handleStartTranslation}
                        className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold shadow-md shadow-emerald-600/25 flex items-center justify-center gap-2 transition-all"
                      >
                        <Icons.Sparkles className="w-4 h-4" />
                        <span>شروع ترجمه هوشمند کل فایل</span>
                      </button>
                    ) : (
                      <button
                        onClick={handlePauseTranslation}
                        className="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold flex items-center justify-center gap-2 transition-all"
                      >
                        <Icons.Pause className="w-4 h-4" />
                        <span>توقف ترجمه خودکار</span>
                      </button>
                    )}

                    <button
                      onClick={handleCleanArtifacts}
                      className="w-full py-2 rounded-xl bg-slate-50 dark:bg-[#1A2232] hover:bg-slate-100 text-slate-700 dark:text-slate-300 font-semibold"
                    >
                      پاکسازی پرانتزها و کلمات انگلیسی
                    </button>

                    <button
                      onClick={handleClearTranslations}
                      className="w-full py-1.5 rounded-xl text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 text-[11px]"
                    >
                      ریست تمام ترجمه‌های فارسی
                    </button>
                  </div>
                </div>
              </aside>

              {/* RIGHT SUBTITLE TABLE: Side-by-Side Editor */}
              <section className="flex-1 w-full bg-white dark:bg-[#111622] rounded-2xl border border-slate-200 dark:border-[#232D3F] shadow-sm overflow-hidden flex flex-col">
                <div className="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-2 font-persian">
                    <span className="w-2.5 h-6 rounded-full bg-emerald-500"></span>
                    <h2 className="font-bold text-sm text-slate-900 dark:text-white">جدول دو زبانه زیرنویس (Side-by-Side Editor)</h2>
                  </div>

                  <button
                    onClick={handleAddSegment}
                    className="px-3 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 font-bold text-xs flex items-center gap-1 hover:bg-emerald-100 transition-colors font-persian"
                  >
                    <Icons.Plus className="w-3.5 h-3.5" />
                    <span>افزودن سطر</span>
                  </button>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-slate-50 dark:bg-[#151C28] text-slate-500 font-persian border-b border-slate-200 dark:border-slate-800">
                      <tr>
                        <th className="p-3 w-14 text-center">#</th>
                        <th className="p-3 w-40 text-center font-mono">زمان‌بندی</th>
                        <th className="p-3 w-1/2 text-left font-sans">English Subtitle</th>
                        <th className="p-3 w-1/2 text-right font-persian">ترجمه فارسی</th>
                        <th className="p-3 w-20 text-center font-persian">عملیات</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                      {segments.map((seg) => (
                        <tr
                          key={seg.id}
                          className={`hover:bg-slate-50/50 dark:hover:bg-[#172030]/60 transition-colors ${
                            selectedSegmentId === seg.id ? 'bg-emerald-50/40 dark:bg-emerald-950/20' : ''
                          }`}
                          onClick={() => setSelectedSegmentId(seg.id)}
                        >
                          <td className="p-3 text-center font-mono text-slate-400 font-bold">{seg.id}</td>
                          <td className="p-3 text-center">
                            <span className="inline-block px-2 py-1 rounded bg-slate-100 dark:bg-[#1A2232] text-slate-600 dark:text-slate-300 font-mono text-[11px]">
                              {seg.startTime}
                            </span>
                          </td>
                          <td className="p-3 text-left font-sans" dir="ltr">
                            <textarea
                              rows={2}
                              value={seg.sourceText}
                              onChange={(e) => handleUpdateSegment(seg.id, 'sourceText', e.target.value)}
                              className="w-full bg-transparent resize-none focus:bg-white dark:focus:bg-[#0B0F17] rounded-lg p-1.5 focus:ring-1 focus:ring-emerald-500 text-slate-800 dark:text-slate-100 leading-relaxed"
                            />
                          </td>
                          <td className="p-3 text-right font-persian" dir="rtl">
                            <textarea
                              rows={2}
                              placeholder="ترجمه فارسی..."
                              value={seg.translatedText}
                              onChange={(e) => handleUpdateSegment(seg.id, 'translatedText', e.target.value)}
                              className="w-full bg-transparent resize-none focus:bg-white dark:focus:bg-[#0B0F17] rounded-lg p-1.5 focus:ring-1 focus:ring-emerald-500 text-slate-900 dark:text-white font-medium leading-relaxed"
                            />
                          </td>
                          <td className="p-3 text-center">
                            <div className="flex items-center justify-center gap-1.5">
                              <button
                                onClick={() => handleTranslateSingle(seg.id)}
                                className={`p-1.5 rounded-lg transition-colors ${
                                  seg.status === 'translating' ? 'animate-spin text-emerald-500' : 'text-slate-400 hover:text-emerald-500'
                                }`}
                                title="ترجمه اختصاصی این سطر"
                              >
                                <Icons.Sparkles className="w-4 h-4" />
                              </button>
                              <button
                                onClick={() => handleDeleteSegment(seg.id)}
                                className="p-1.5 rounded-lg text-slate-400 hover:text-rose-500 transition-colors"
                                title="حذف سطر"
                              >
                                <Icons.Trash2 className="w-4 h-4" />
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            </main>

            {/* 5. TOAST NOTIFICATION */}
            {notification && (
              <div className="fixed bottom-6 right-6 z-50 animate-bounce">
                <div className={`px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2.5 text-xs font-persian font-bold text-white ${
                  notification.type === 'success' ? 'bg-emerald-600' : notification.type === 'error' ? 'bg-rose-600' : 'bg-slate-900'
                }`}>
                  {notification.type === 'success' && <Icons.CheckCircle2 className="w-4 h-4" />}
                  {notification.type === 'error' && <Icons.AlertCircle className="w-4 h-4" />}
                  <span>{notification.message}</span>
                </div>
              </div>
            )}

            {/* 6. MODALS */}
            {/* Terminology Modal */}
            {isTerminologyOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                <div className="bg-white dark:bg-[#111622] rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-4 font-persian">
                  <div className="flex items-center justify-between border-b pb-3 dark:border-slate-800">
                    <h3 className="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                      <Icons.BookOpen className="w-4 h-4 text-emerald-500" />
                      <span>بانک اصطلاحات سبک: {currentProfile.persianName}</span>
                    </h3>
                    <button onClick={() => setIsTerminologyOpen(false)} className="text-slate-400 hover:text-slate-600">
                      <Icons.X className="w-5 h-5" />
                    </button>
                  </div>
                  <div className="max-h-80 overflow-y-auto space-y-2 pr-1">
                    {currentProfile.items.map((item) => (
                      <div key={item.id} className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-[#1A2232] text-xs">
                        <span className="font-mono font-bold text-emerald-600 dark:text-emerald-400">{item.english}</span>
                        <span className="font-bold text-slate-800 dark:text-slate-200">{item.persian}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* API Key Modal */}
            {isApiKeyOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                <div className="bg-white dark:bg-[#111622] rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 font-persian text-xs">
                  <div className="flex items-center justify-between border-b pb-3 dark:border-slate-800">
                    <h3 className="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                      <Icons.Key className="w-4 h-4 text-emerald-500" />
                      <span>تنظیم کلید هوش مصنوعی (Google Gemini)</span>
                    </h3>
                    <button onClick={() => setIsApiKeyOpen(false)}><Icons.X className="w-5 h-5 text-slate-400" /></button>
                  </div>
                  <p className="text-slate-400 leading-relaxed">
                    برای فعال‌سازی ترجمه فوق‌العاده با مدل Gemini 1.5 Flash می‌توانید کلید رایگان خود را اینجا وارد کنید. (در صورت خالی بودن، مترجم داخلی خودکار فعال خواهد بود).
                  </p>
                  <input
                    type="password"
                    placeholder="AIzaSy..."
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    className="w-full bg-slate-50 dark:bg-[#1A2232] border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 font-mono"
                  />
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      onClick={() => {
                        try { localStorage.setItem('gabriel_gemini_key', apiKey); } catch (e) {}
                        setIsApiKeyOpen(false);
                        showToast('کلید هوش مصنوعی ذخیره شد', 'success');
                      }}
                      className="px-5 py-2 rounded-xl bg-emerald-600 text-white font-bold"
                    >
                      ذخیره و فعال‌سازی
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Help Modal */}
            {isHelpOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                <div className="bg-white dark:bg-[#111622] rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 font-persian text-xs">
                  <div className="flex items-center justify-between border-b pb-3 dark:border-slate-800">
                    <h3 className="font-bold text-sm text-slate-900 dark:text-white">راهنمای استفاده از گابریل</h3>
                    <button onClick={() => setIsHelpOpen(false)}><Icons.X className="w-5 h-5 text-slate-400" /></button>
                  </div>
                  <ul className="space-y-2 text-slate-600 dark:text-slate-300 leading-relaxed list-disc pr-4">
                    <li>با دکمه <b>آپلود فایل</b>، فایل زیرنویس SRT خود را انتخاب کنید.</li>
                    <li>می‌توانید روی هر سطر کلیک کرده و متن انگلیسی یا ترجمه فارسی را مستقیماً ویرایش نمایید.</li>
                    <li>کلید میانبر <b>Ctrl+H</b> برای پنجره جستجو و جایگزینی کلمات است.</li>
                    <li>با زدن <b>دانلود فایل / Download SRT</b>، زیرنویس ترجمه‌شده فارسی فوراً با انکودینگ استاندارد دانلود می‌شود.</li>
                  </ul>
                </div>
              </div>
            )}

            {/* Export Modal */}
            {isExportOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                <div className="bg-white dark:bg-[#111622] rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 font-persian text-xs">
                  <div className="flex items-center justify-between border-b pb-3 dark:border-slate-800">
                    <h3 className="font-bold text-sm text-slate-900 dark:text-white">خروجی در فرمت‌های مختلف</h3>
                    <button onClick={() => setIsExportOpen(false)}><Icons.X className="w-5 h-5 text-slate-400" /></button>
                  </div>
                  <div className="space-y-2">
                    <button
                      onClick={() => {
                        handleDownloadSRT();
                        setIsExportOpen(false);
                      }}
                      className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 text-right hover:border-emerald-500 font-bold"
                    >
                      خروجی استاندارد زیرنویس فارسی (.SRT)
                    </button>
                    <button
                      onClick={() => {
                        const content = generateSRT(segments, false);
                        downloadSRTFile(content, 'Bilingual_Subtitles.srt');
                        setIsExportOpen(false);
                        showToast('زیرنویس دوزبانه دانلود شد', 'success');
                      }}
                      className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 text-right hover:border-emerald-500 font-bold"
                    >
                      زیرنویس دو زبانه همزمان (انگلیسی + فارسی)
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
